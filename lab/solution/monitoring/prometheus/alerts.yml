# Aturan alert. Lihat statusnya di Prometheus -> menu Alerts (inactive / pending / firing).
# severity: page = bangunkan orang (harus ditindak SEKARANG) | ticket = buat tiket, cek jam kerja.
groups:
  - name: harga-rumah
    rules:
      - alert: ErrorRateTinggi
        expr: |
          (sum(rate(api_requests_total{endpoint="/predict", status=~"5.."}[1m])) or vector(0))
            / clamp_min(sum(rate(api_requests_total{endpoint="/predict"}[1m])), 1e-9) > 0.05
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Lebih dari 5% request /predict gagal (5xx) selama 1 menit"

      - alert: LatencyP95Lambat
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(api_request_latency_seconds_bucket{endpoint="/predict"}[5m]))) > 0.5
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "p95 latency /predict di atas 500 ms selama 2 menit"

      - alert: DriftJarakKePusat
        expr: |
          sum(rate(input_jarak_ke_pusat_km_sum[1m])) / sum(rate(input_jarak_ke_pusat_km_count[1m])) > 28
        for: 30s   # di produksi biasanya lebih lama (mis. 30m); dipendekkan supaya terlihat di kelas
        labels:
          severity: ticket
        annotations:
          summary: "Rata-rata jarak_ke_pusat_km di request > 28 km (training ~19 km): kemungkinan data drift"
